name: CI

on:
  push:
  pull_request:

# Co-sign N2: read-only token, and actions pinned to commit SHAs
# (a tag is mutable; a SHA is not).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # v4.2.2
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python 3.12
        # v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install the sqlite3 CLI
        # The M9/M10 tests run the real backup script, which shells
        # out to sqlite3. GitHub's ubuntu image ships it, but a
        # missing CLI fails those tests — install it if absent.
        run: |
          if ! command -v sqlite3; then
            sudo apt-get update && sudo apt-get install -y sqlite3
          fi
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: python -m pytest tests/ -q
