name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the sqlite3 CLI
        # The M9/M10 tests run the real backup script, which shells
        # out to sqlite3. GitHub's ubuntu image ships it, but a
        # missing CLI fails those tests — install it if absent.
        run: |
          if ! command -v sqlite3; then
            sudo apt-get update && sudo apt-get install -y sqlite3
          fi
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: python -m pytest tests/ -q
