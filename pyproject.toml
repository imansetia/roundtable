[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roundtable-mcp"
version = "0.2.1"
description = "Shared task board that lets AI agents from different vendors work together over MCP"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Official MCP Python SDK v2 — verified against 2.3.0 (see CHANGELOG.md).
    # v2 renamed FastMCP to MCPServer; do not use the v1 import path.
    "mcp[cli]==2.3.0",
    "uvicorn>=0.30",
    # worker.py uses httpx at runtime (MCP client + model calls), so it
    # is a main dependency, not dev-only (AUDIT-M2 W5).
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/imansetia/roundtable"
Repository = "https://github.com/imansetia/roundtable"
Issues = "https://github.com/imansetia/roundtable/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
roundtable = "roundtable.cli:main"

# Explicit package list: setuptools' flat-layout auto-discovery would
# otherwise see deploy/ (M3 templates) as a second top-level package
# and refuse to build ("Multiple top-level packages discovered").
[tool.setuptools]
packages = ["roundtable"]

[tool.pytest.ini_options]
testpaths = ["tests"]
