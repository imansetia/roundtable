# Roundtable nginx site — PHASE 2, full HTTPS site (M3).
#
# Install this AFTER certbot has issued the certificate (phase 1 must
# have run first):
#   sudo cp deploy/nginx/roundtable.conf /etc/nginx/sites-available/roundtable
#   sudo sed -i "s/roundtable.example.com/$PUBLIC_NAME/" /etc/nginx/sites-available/roundtable
#   sudo nginx -t && sudo systemctl reload nginx
#
# "roundtable.example.com" is a placeholder: replace it with your real
# public DNS name before nginx -t. Never leave the placeholder in place.
#
# What this file does:
# - Listens on 443 (HTTPS) only for the MCP path /mcp; every other path
#   returns 404. Port 80 only serves the ACME challenge and redirects
#   everything else to HTTPS.
# - Passes Host as the public name ($host, never $http_host, which a
#   client could forge) so the app's allowed-hosts check sees it.
# - Never logs the Authorization header: the default combined log format
#   records address, time, request line, status, size, referrer and
#   user-agent only. Never add $http_authorization to a log format.

# Coarse per-IP second layer (optional but on by default): 10 requests
# per second per IP, burst 20. The server's own per-token limit
# (60/minute per token) is the real limit; this only blunts floods.
# It lives here, at http level, because sites-enabled files are included
# inside nginx's http block.
limit_req_zone $binary_remote_addr zone=mcp:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name roundtable.example.com;

    access_log /var/log/nginx/roundtable.access.log;
    error_log /var/log/nginx/roundtable.error.log warn;

    # Let's Encrypt HTTP-01 challenge (also used by automatic renewals).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name roundtable.example.com;

    # Certificate paths written by certbot (phase 1). The sed command in
    # the install step replaces the placeholder in these two lines too.
    ssl_certificate /etc/letsencrypt/live/roundtable.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roundtable.example.com/privkey.pem;

    # TLS hardening: TLS 1.2 and 1.3 only, modern ciphers, no session
    # tickets (better forward secrecy).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS: browsers must use HTTPS for this name for the next 2 years.
    # No "preload": that is a one-way public commitment; do not add it
    # without understanding https://hstspreload.org.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Body limit: the largest legitimate input is a 20,000-character
    # result (about 25 KB normally, up to ~120 KB worst-case escaped
    # Unicode) plus JSON overhead. 256 KB is about twice that and far
    # below the app's own 4 MB default.
    client_max_body_size 256k;

    access_log /var/log/nginx/roundtable.access.log;
    error_log /var/log/nginx/roundtable.error.log warn;

    # Only the MCP path is exposed. Streamable HTTP needs unbuffered
    # proxying (the GET stream stays open) and long read timeouts.
    location = /mcp {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        # $host is nginx's own server name (the public DNS name, no
        # port). The app checks it against ROUNDTABLE_ALLOWED_HOSTS.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        limit_req zone=mcp burst=20 nodelay;
    }

    # Everything else: 404. The board is not a website.
    location / {
        return 404;
    }
}
