# Roundtable nginx site — PHASE 1, HTTP only (M3).
#
# Install this FIRST, before certbot, so Let's Encrypt can reach the
# ACME challenge over plain HTTP:
#   sudo cp deploy/nginx/roundtable-http-only.conf /etc/nginx/sites-available/roundtable
#   sudo sed -i "s/roundtable.example.com/$PUBLIC_NAME/" /etc/nginx/sites-available/roundtable
#   sudo ln -s /etc/nginx/sites-available/roundtable /etc/nginx/sites-enabled/roundtable
#   sudo nginx -t && sudo systemctl reload nginx
#
# After certbot has issued the certificate, replace this file with
# deploy/nginx/roundtable.conf (phase 2) and reload again.
# "roundtable.example.com" is a placeholder: replace it with your real
# public DNS name before nginx -t. Never leave the placeholder in place.

server {
    listen 80;
    listen [::]:80;
    server_name roundtable.example.com;

    access_log /var/log/nginx/roundtable.access.log;
    error_log /var/log/nginx/roundtable.error.log warn;

    # Let's Encrypt HTTP-01 challenge. certbot --webroot writes its
    # answer files here; everything else is redirected to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Catch-all (AUDIT-M3 R1): any name — or the bare IP — that is not our
# public name gets nothing; the connection is dropped silently (444).
# The ACME challenge above still works: it is reached by our name.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 444;
}
